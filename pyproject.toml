[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield-lab"
version = "0.1.0"
description = "Inspectable transformer fine-tuning and an Ollama prompt-injection defense study"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5,<3", "transformers>=4.48,<6", "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2", "requests>=2.32,<3", "safetensors>=0.5,<1",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
