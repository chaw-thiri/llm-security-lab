name: Offline research checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify reports against committed records (standard library only)
        run: python -S scripts/render_reports.py --check

      - name: Install CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install -e .

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
